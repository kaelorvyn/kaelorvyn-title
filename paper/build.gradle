plugins {
    id 'java'
}

group = 'com.kael'
version = '1.0.0'

def packetEventsJar = System.getenv('PACKETEVENTS_JAR')
        ?: 'D:/MC/server/[25568]lifesteal生存/plugins/packetevents-spigot-2.13.0.jar'

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.8-R0.1-SNAPSHOT'
    compileOnly files(packetEventsJar)

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

test {
    useJUnitPlatform()
}

jar {
    archiveFileName = 'KaelorvynTitle-Paper-1.0.0.jar'
}
